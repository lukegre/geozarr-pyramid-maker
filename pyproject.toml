[project]
name = "geozarr-pyramid-maker"
version = "0.1.0"
description = "Convert regular-grid xarray data into GeoZarr multiscale pyramids (Zarr v3, sharded)."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "lukegre", email = "lukegre@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dask[array]>=2025.1",
    "geozarr-toolkit>=0.1.2",
    "loguru>=0.7",
    "numpy>=2",
    "pyproj>=3.7",
    "rioxarray>=0.19",
    "typer>=0.12",
    "xarray>=2026.2.0",
    "zarr>=3.1",
]

[project.scripts]
geozarr-pyramid = "geozarr_pyramid_maker.cli:app"

[project.optional-dependencies]
cloud = [
    "aiohttp>=3.9",
    "fsspec>=2025.1",
    "obstore>=0.11.1",
]

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m \"not slow and not network\""
filterwarnings = [
    # rioxarray internals (Affine * Affine); not ours to fix
    "ignore:Use `@` matmul instead of `\\*` mul operator:PendingDeprecationWarning",
]
markers = [
    "slow: long-running tests",
    "network: tests that need network access",
]

[dependency-groups]
dev = [
    "aiohttp>=3.14.3",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "netcdf4>=1.7.4",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "requests>=2.34.2",
    "ruff>=0.16.9",
]
