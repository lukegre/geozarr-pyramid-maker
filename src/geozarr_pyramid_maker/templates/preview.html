<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>GeoZarr viewer | GeoZarr preview</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.10.0/ol.css">
<style>
  :root {
    --sp: 8px;
    --radius: 8px;
    --sb-w: 320px;
    --scrub-h: 0px;
    --top-h: 44px;
    --card: #ffffff;
    --card-line: rgba(0, 0, 0, .08);
    --sidebar: #f3f4f6;
    --text: #1f2328;
    --muted: #6b7280;
    --accent: #2563eb;
    --rail: rgba(0, 0, 0, .16);
    --hover: rgba(127, 127, 127, .16);
    --shadow: 0 1px 3px rgba(0, 0, 0, .14), 0 1px 2px rgba(0, 0, 0, .08);
    --map-bg: #111418;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --card: rgba(22, 27, 34, .92);
      --card-line: rgba(255, 255, 255, .08);
      --sidebar: #0d1117;
      --text: #e6edf3;
      --muted: #9aa4b2;
      --accent: #58a6ff;
      --rail: rgba(255, 255, 255, .22);
      --shadow: 0 1px 3px rgba(0, 0, 0, .55);
    }
  }
  body.collapsed { --sb-w: 44px; --top-h: 0px; }
  body.has-scrub { --scrub-h: 76px; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text);
    background: var(--map-bg); overflow: hidden; }
  input, select, button { font: inherit; color: inherit; accent-color: var(--accent); }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  #map { position: absolute; top: var(--top-h); bottom: 0; right: 0; left: var(--sb-w); background: var(--map-bg); }

  /* sidebar */
  #sidebar { position: absolute; top: var(--top-h); bottom: 0; left: 0; width: var(--sb-w); z-index: 5;
    display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;
    background: var(--sidebar); border-right: 1px solid var(--card-line); }
  #sbtoggle { position: absolute; top: 4px; right: var(--sp); z-index: 2; width: 28px; height: 28px;
    display: grid; place-items: center; padding: 0; border: 0; border-radius: 6px; background: transparent;
    color: var(--muted); }
  #sbtoggle:hover, .iconbtn:hover { background: var(--hover); color: var(--text); }
  #sbtoggle svg { width: 16px; height: 16px; }
  body.collapsed #sbtoggle { right: 4px; }
  body.collapsed #sbtoggle svg { transform: rotate(180deg); }
  body.collapsed #sidebar > :not(#sbtoggle, #sbspine) { display: none; }
  body.collapsed #topbar, body.collapsed #infopanel { display: none; }
  #sbspine { display: none; }
  body.collapsed #sbspine { display: block; position: absolute; top: 44px; bottom: 12px; left: 0; right: 0;
    padding: 0; border: 0; background: transparent; color: inherit; font: inherit; cursor: pointer;
    overflow: hidden; }
  #sbspine span { position: absolute; left: 50%; top: 0; transform: translateX(-50%) rotate(180deg);
    writing-mode: vertical-rl; white-space: nowrap; font-size: 15px; line-height: 1;
    max-height: 100%; overflow: hidden; text-overflow: ellipsis; }
  #sbspine b { font-weight: 600; }
  #sbspine i { font-style: normal; color: var(--muted); }
  #sidebar { padding-top: 36px; }
  /* top bar: full window width, always visible while the sidebar is expanded */
  #topbar { position: fixed; top: 0; left: 0; right: 0; height: var(--top-h); z-index: 10;
    box-sizing: border-box; padding: 0 var(--sp); display: flex; align-items: center; gap: var(--sp);
    background: var(--sidebar); border-bottom: 1px solid var(--card-line); }
  #storepath { flex: 1; min-width: 0; box-sizing: border-box; height: 30px; padding: 4px 10px;
    border: 1px solid var(--card-line); border-radius: 6px; background: var(--card); color: inherit;
    font: inherit; text-overflow: ellipsis; }
  #storepath:focus { border-color: #4a90e2; outline: none; }
  #storepath.busy { opacity: .6; }
  #storeerr { margin: 0 16px 4px; padding: 8px 10px; border-radius: 6px; font-size: 12px;
    line-height: 1.4; border: 1px solid #d1242f; background: rgba(209, 36, 47, .1); overflow-wrap: anywhere; }
  #storeerr .msg { font-weight: 600; color: #d1242f; }
  #storeerr .hint { margin-top: 4px; }
  #storeerr code { font-size: 11px; padding: 0 3px; border-radius: 3px; background: rgba(127, 127, 127, .2); }
  .iconbtn { flex: none; width: 24px; height: 24px; display: grid; place-items: center; padding: 0;
    border: 0; border-radius: 6px; background: transparent; color: var(--muted); }
  .iconbtn svg { width: 16px; height: 16px; }
  #infobtn[aria-expanded="true"] { background: var(--hover); color: var(--text); }
  #infopanel { position: fixed; z-index: 12; top: calc(var(--top-h) + 4px); right: var(--sp);
    width: min(520px, calc(100vw - 2 * var(--sp))); max-height: calc(100vh - var(--top-h) - 16px);
    overflow: auto; box-sizing: border-box; padding: var(--sp) 12px 12px; border-radius: var(--radius);
    background: var(--card); box-shadow: var(--shadow); border: 1px solid var(--card-line); font-size: 12px; }
  #infopanel h2 { margin: 8px 0 4px; font-size: 12px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .04em; }
  #infopanel table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  #infopanel th, #infopanel td { padding: 3px 6px; text-align: left; vertical-align: top;
    border-top: 1px solid var(--card-line); overflow-wrap: anywhere; }
  #infopanel th { width: 32%; font-weight: 600; color: var(--muted); }
  #infopanel td { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
  #s3row { display: flex; flex-direction: column; gap: 3px; margin: 0 16px 8px; font-size: 12px; }
  #s3row label { font-weight: 600; color: var(--muted); }
  #s3row[hidden] { display: none; }
  #endpoint { padding: 3px 6px; border: 1px solid var(--card-line); border-radius: 4px;
    background: transparent; color: var(--text); font: inherit; }
  #endpoint:focus { border-color: #4a90e2; outline: none; }
  #cards { flex: 1; overflow: auto; padding: var(--sp); display: flex; flex-direction: column; gap: var(--sp); }
  .card { padding: 12px; border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow);
    border: 1px solid var(--card-line); cursor: pointer; }
  .card:hover { border-color: var(--muted); }
  .card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
  .card .top { display: flex; align-items: flex-start; gap: var(--sp); }
  .card .name { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
  .card .meta { margin-top: 2px; font-size: 12px; color: var(--muted); }
  .cardsec { display: flex; flex-direction: column; gap: var(--sp); }
  .cardsec[hidden], .seccards[hidden] { display: none; }
  .draghandle { cursor: grab; touch-action: none; }
  .card.dragging { opacity: .45; }
  .cardsec.drop-target { outline: 2px dashed var(--accent); outline-offset: 2px; }
  .card.drop-before { border-top: 3px solid var(--accent); }
  .seccards { display: flex; flex-direction: column; gap: var(--sp); }
  .sechead { margin: 0; padding: 0 2px; font-size: 11px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: var(--muted); }
  .sectoggle { display: flex; align-items: center; gap: 4px; border: 0; background: none; cursor: pointer;
    font-family: inherit; text-align: left; }
  .sectoggle:hover { color: var(--text); }
  .sectoggle .chev { width: 12px; height: 12px; transition: transform .15s; }
  .sectoggle[aria-expanded="false"] .chev { transform: rotate(-90deg); }
  #selhint { padding: 0 var(--sp); margin-top: var(--sp); font-size: 11px; color: var(--muted); }
  .card .gear, .card .visibility, .card .remove { display: none; }
  .card.selected .gear, .card.selected .visibility, .card.selected .remove { display: grid; }
  .card .gear[aria-expanded="true"] { background: var(--hover); color: var(--text); }
  .card .opts { display: none; flex-direction: column; gap: var(--sp); margin-top: var(--sp);
    font-size: 12px; color: var(--muted); cursor: default; }
  .card.selected.open .opts { display: flex; }
  .card .opts .longname { color: var(--text); overflow-wrap: anywhere; }
  .card .opts .row { display: flex; align-items: center; gap: var(--sp); }
  .card .opts .row > label { flex: none; width: 64px; }
  .card .opts input[type=range] { flex: 1; min-width: 0; }
  .card .opts input[type=number], .card .opts select { flex: 1; min-width: 0; width: 0; padding: 3px 6px;
    border-radius: 6px; border: 1px solid var(--card-line); background: transparent; color: var(--text); }
  .card .opts select option, .card .opts select optgroup { background: var(--sidebar); color: var(--text); }
  .card .opts input.bad { outline: 2px solid #d1242f; }
  .card .opts .sep { flex: none; }
  .card .opts .cmbar { flex: none; width: 56px; height: 10px; border-radius: 5px; }
  .card .opts .check { display: flex; align-items: center; gap: 6px; }
  .card .opts .btn { flex: 1; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--card-line);
    background: transparent; color: var(--text); }
  .card .opts .btn:hover { background: var(--hover); }
  .legend { margin-top: 12px; }
  .legend .bar { height: 10px; border-radius: 5px; }
  .legend .ticks { position: relative; height: 24px; margin-top: 2px;
    font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .legend .tick { position: absolute; top: 0; width: 1px; height: 4px; background: var(--muted); }
  .legend .tlabel { position: absolute; top: 6px; white-space: nowrap; line-height: 14px; }
  .legend .cat { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-top: 4px;
    font-variant-numeric: tabular-nums; }
  .legend .swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  #sbfoot { padding: 12px 16px; border-top: 1px solid var(--card-line); }
  #sbfoot label, #dimroles-title, #cmapmore-title { display: block; margin-bottom: 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
  #gs-title { margin: 0 0 8px; padding: 0; width: 100%; gap: 6px; font-size: 13px; font-weight: 700; color: var(--text); }
  #gs-title:hover { color: var(--text); }
  #gs-title .gsicon { display: grid; flex: none; color: var(--muted); }
  #gs-title .gsicon svg { width: 14px; height: 14px; }
  #gs-title:hover .gsicon { color: var(--text); }
  #gs-title .chev { margin-left: auto; color: var(--muted); }
  #sbfoot.gs-collapsed #gs-title { margin-bottom: 0; }
  #labelrow { margin-bottom: 10px; }
  #lonrow, #dimroles, #cmapmore { margin-top: 10px; }
  #dimroles label.dimrow { display: flex; align-items: center; justify-content: space-between; gap: var(--sp);
    margin-bottom: 4px; font-weight: 400; color: var(--text); }
  #dimroles .dimname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #cmapmore { display: flex; flex-wrap: wrap; align-items: center; gap: 4px var(--sp); }
  #cmapmore-title { flex: 0 0 100%; }
  #sbfoot #cmapmore label.cmaprow { display: flex; align-items: center; gap: 4px; margin-bottom: 0;
    font-weight: 400; color: var(--text); cursor: pointer; }
  #sbfoot #dimroles select { width: 104px; flex: none; }
  #sbfoot input[type=number] { width: 100%; box-sizing: border-box; padding: 4px 8px; border-radius: 6px;
    border: 1px solid var(--card-line); background: transparent; color: inherit; font: inherit; }
  #sbfoot select { width: 100%; box-sizing: border-box; padding: 4px 8px; border-radius: 6px;
    border: 1px solid var(--card-line); background: var(--card); }
  #note, #error { margin-top: var(--sp); font-size: 11px; color: var(--muted); }
  #error { color: #d1242f; white-space: pre-wrap; }

  /* time scrubber */
  #scrubber { position: absolute; z-index: 4; left: calc(var(--sb-w) + var(--sp)); right: var(--sp);
    bottom: var(--sp); height: 68px; box-sizing: border-box; padding: 4px 12px; display: flex;
    align-items: flex-start; gap: var(--sp); border-radius: var(--radius); background: var(--card);
    box-shadow: var(--shadow); border: 1px solid var(--card-line); user-select: none; }
  #scrubber .ctl { display: flex; align-items: center; gap: 2px; padding-top: 22px; flex: none; }
  #scrubber .ctl button { width: 28px; height: 28px; display: grid; place-items: center; padding: 0;
    border: 0; border-radius: 6px; background: transparent; }
  #scrubber .ctl button:hover { background: var(--hover); }
  #scrubber .ctl svg { width: 16px; height: 16px; }
  #scrubber .dname { flex: none; padding-top: 30px; font-size: 12px; color: var(--muted); }
  #scrubber .track { position: relative; flex: 1; min-width: 0; height: 60px; margin: 0 20px; touch-action: none;
    cursor: pointer; }
  #scrubber .rail { position: absolute; left: 0; right: 0; top: 30px; height: 4px; border-radius: 2px;
    background: var(--rail); }
  #scrubber .mark { position: absolute; width: 1px; background: var(--muted); opacity: .8; }
  #scrubber .mark.minor { top: 38px; height: 4px; opacity: .5; }
  #scrubber .mark.major { top: 38px; height: 7px; }
  #scrubber .tlabel { position: absolute; top: 46px; transform: translateX(-50%); font-size: 11px;
    line-height: 14px; white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
  #scrubber .handle { position: absolute; top: 24px; width: 16px; height: 16px; margin-left: -8px;
    border-radius: 50%; background: var(--accent); border: 2px solid var(--card); box-sizing: border-box;
    box-shadow: 0 0 0 1px var(--accent); cursor: grab; }
  #scrubber .bubble { position: absolute; top: 0; transform: translateX(-50%); padding: 1px 8px;
    border-radius: 6px; background: var(--accent); color: #fff; font-size: 12px; line-height: 18px;
    white-space: nowrap; font-variant-numeric: tabular-nums; pointer-events: none; }
  #dimstack { position: absolute; z-index: 4; right: var(--sp); bottom: calc(var(--scrub-h) + 44px);
    display: flex; gap: var(--sp); }
  #dimstack .dim { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: var(--sp);
    border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow);
    border: 1px solid var(--card-line); font-size: 12px; }
  #dimstack .dim .lab { color: var(--muted); }
  #dimstack .dim .val { font-variant-numeric: tabular-nums; }
  #dimstack input[type=range] { writing-mode: vertical-lr; width: 16px; height: 96px; margin: 0; }

  /* map chrome */
  .ol-zoom { top: calc(var(--top-h) + var(--sp)); left: auto; right: var(--sp); padding: 2px; border-radius: var(--radius);
    background: var(--card); box-shadow: var(--shadow); border: 1px solid var(--card-line); }
  .ol-zoom button { width: 28px; height: 28px; margin: 0; border-radius: 6px; background: transparent;
    color: var(--text); font: 600 16px/1 system-ui, sans-serif; }
  .ol-zoom button:hover, .ol-zoom button:focus { background: var(--hover); color: var(--text); }
  .ol-attribution, .ol-attribution.ol-uncollapsible, .ol-attribution.ol-collapsed {
    bottom: calc(var(--scrub-h) + var(--sp)); right: var(--sp); border-radius: var(--radius);
    background: var(--card); box-shadow: var(--shadow); border: 1px solid var(--card-line);
    font: 11px/1.4 system-ui, sans-serif; color: var(--muted); }
  .ol-attribution ul { margin: 0; padding: 2px 8px; color: var(--muted); font-size: 11px; text-shadow: none; }
  .ol-attribution a { color: inherit; }
  .ol-attribution button { background: transparent; color: var(--text); }
  .bm-light canvas { filter: grayscale(1) brightness(1.08) contrast(.9); }
  .bm-dark canvas { filter: invert(1) hue-rotate(180deg) grayscale(.85) brightness(.85) contrast(.9); }
  #readout { position: fixed; left: 0; top: 0; z-index: 8; pointer-events: none; padding: 2px 8px;
    border-radius: 6px; background: var(--card); box-shadow: var(--shadow); border: 1px solid var(--card-line);
    font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #readout .ro-coord { color: var(--muted); font-size: 11px; white-space: pre; }
</style>
</head>
<body>
<div id="map"></div>
<header id="topbar">
  <input id="storepath" type="text" spellcheck="false" autocomplete="off" value=""
    aria-label="Store path or URL (press Enter to open)"
    title="Local path, https:// or s3:// URL of a GeoZarr pyramid. Press Enter to open.">
  <button id="infobtn" class="iconbtn" type="button" aria-label="Dataset information" aria-expanded="false">
    <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.25" fill="none"
      stroke="currentColor" stroke-width="1.5"/><path d="M8 7.2v4" fill="none" stroke="currentColor"
      stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="4.9" r=".9" fill="currentColor"/></svg>
  </button>
</header>
<div id="infopanel" hidden></div>
<aside id="sidebar">
  <button id="sbtoggle" type="button" aria-label="Collapse sidebar" aria-expanded="true">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button id="sbspine" type="button" aria-label="Expand sidebar"><span></span></button>
  <div id="storeerr" role="alert" hidden></div>
  <div id="s3row" hidden>
    <label for="endpoint">S3 endpoint URL</label>
    <input id="endpoint" type="text" spellcheck="false" autocomplete="off"
      placeholder="https://os.zhdk.cloud.switch.ch"
      title="Custom S3 service for s3:// stores. Press Enter to open the store with it.">
  </div>
  <div id="selhint" hidden>Click to select. Use the eye to show or hide, and × to remove. Drag handles to reorder. The top card is drawn on top.</div>
  <div id="cards">
    <section id="sec-selected" class="cardsec" hidden>
      <h2 class="sechead" id="sel-head">Selected</h2>
      <div id="sel-cards" class="seccards"></div>
    </section>
    <section id="sec-other" class="cardsec" hidden>
      <button type="button" id="other-toggle" class="sechead sectoggle" aria-expanded="true" aria-controls="other-cards">
        <svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="other-label">Other</span>
      </button>
      <div id="other-cards" class="seccards"></div>
    </section>
  </div>
  <div id="sbfoot">
    <button type="button" id="gs-title" class="sectoggle" aria-expanded="true" aria-controls="gs-body">
      <span class="gsicon" id="gs-icon"></span>
      <span>Global settings</span>
      <svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div id="gs-body">
    <div id="labelrow">
      <label for="labelmode">Label by</label>
      <select id="labelmode">
        <option value="name">Array name</option>
        <option value="long">Long name</option>
      </select>
    </div>
    <label for="basemap">Basemap</label>
    <select id="basemap"></select>
    <div id="dimroles" hidden>
      <span id="dimroles-title">Dimensions</span>
      <div id="dimrows"></div>
    </div>
    <div id="cmapmore" hidden>
      <span id="cmapmore-title">Colourmaps</span>
      <label class="cmaprow"><input type="checkbox" id="cmap-matplotlib"><span>matplotlib</span></label>
      <label class="cmaprow"><input type="checkbox" id="cmap-cmocean"><span>cmocean</span></label>
      <label class="cmaprow"><input type="checkbox" id="cmap-cmasher"><span>cmasher</span></label>
    </div>
    <div id="lonrow" hidden>
      <label for="centerlon">Centre longitude</label>
      <input id="centerlon" type="number" min="-180" max="180" step="10" value="0">
    </div>
    </div>
    <div id="note" hidden>Open via the preview server (geozarr-pyramid preview --serve); opening this
      page directly from disk will not work.</div>
    <div id="error"></div>
  </div>
</aside>
<div id="dimstack" hidden></div>

const AUTO_TITLE = 'Set the range from the data in the current frame (2\u201398 %). If the signs balance the range is symmetric and a diverging colourmap (RdBu, reversed) is used.';
const AUTO_NONE = 'No loaded data for the current frame';
const AUTO_MAX = 200000;  // values collected for Auto at most

// Band-0 values of the loaded tiles of the variable's current dimension slice (D-48), for the Auto range.
// Same tile cache as sampleLayer (no store I/O): only tiles whose `key` is the source's current key (D-41) and
// only the highest loaded zoom among them, every world copy included. Gutter and alpha as in sampleLayer
// (last band when there are several, 0 = nodata); non-finite values are skipped. A common 2-D stride keeps
// at most ~AUTO_MAX values. Returns a Float64Array (empty when nothing is loaded).
function frameValues(name) {
  const vl = state.vlayers.get(name);
  const tiles = [];
  let z = -1;
  if (vl) vl.layers.forEach((layer, i) => {
    const cache = layer.getRenderer?.()?.tileRepresentationCache;
    if (!cache) return;
    const key = vl.sources[i].getKey();
    cache.forEach((rep) => {
      const tile = rep && rep.loaded && rep.tile;
      if (!tile || tile.key !== key || tile.getState() !== 2) return;  // 2 = TileState.LOADED
      const tz = tile.tileCoord[0];
      if (tz > z) { z = tz; tiles.length = 0; }
      if (tz === z) tiles.push({tile, g: rep.gutter || 0});
    });
  });
  let total = 0;
  for (const t of tiles) { const [w, h] = t.tile.getSize(); total += w * h; }
  const step = Math.max(1, Math.ceil(Math.sqrt(total / AUTO_MAX)));
  const out = new Float64Array(tiles.reduce((n, t) => {
    const [w, h] = t.tile.getSize();
    return n + Math.ceil(w / step) * Math.ceil(h / step);
  }, 0));
  let n = 0;
  for (const {tile, g} of tiles) {
    const data = tile.getData();
    const [w, h] = tile.getSize();
    if (!data || !data.length) continue;
    const bands = Math.max(1, Math.round(data.length / ((w + 2 * g) * (h + 2 * g))));
    for (let row = 0; row < h; row += step) {
      for (let col = 0; col < w; col += step) {
        const px = ((row + g) * (w + 2 * g) + col + g) * bands;
        if (bands > 1 && !data[px + bands - 1]) continue;
        const val = data[px];
        if (Number.isFinite(val)) out[n++] = val;
      }
    }
  }
  return out.subarray(0, n);
}

function symmetricCmap(cmap, reversed) {

// without finite values. Mirrored to [-m, m] when lo < 0 < hi and the smaller magnitude is at least half the
// larger (`symmetric: true`); vmax = vmin + 1 when the range is empty.
function autoRange(values) {
  const v = Float64Array.from(Array.from(values).filter(Number.isFinite)).sort();
  if (!v.length) return null;
  const pct = (p) => {
    const x = p * (v.length - 1), i = Math.floor(x);
    return i + 1 < v.length ? v[i] + (v[i + 1] - v[i]) * (x - i) : v[i];

  const symmetric = lo < 0 && hi > 0 && Math.min(a, b) / Math.max(a, b) >= 0.5;
  if (symmetric) { hi = Math.max(a, b); lo = -hi; }
  if (!(hi > lo)) hi = lo + 1;

  autoBtn.type = symBtn.type = 'button';
  autoBtn.title = AUTO_TITLE;
  btnRow.append(autoBtn, symBtn);

  const sync = () => {
    const s = styleOf(v);
    fill();
    rev.checked = s.reversed;
    minIn.value = String(+s.vmin.toPrecision(6));
    maxIn.value = String(+s.vmax.toPrecision(6));
    cmBar.style.background = gradientCss(stopsOf(s));
  };
  const apply = (clear) => {
    const legend = buildLegend(v);
    entry.legend.replaceWith(legend);
    entry.legend = legend;
    sync();
    if (clear) store.remove(styleKey(v)); else store.set(styleKey(v), JSON.stringify(styleOf(v)));
    syncUrl();
    const vl = state.vlayers.get(v.name);
    if (vl) for (const l of vl.layers) l.setStyle({color: colorExpr(v)});
  };
  const flashBad = () => {
    for (const i of [minIn, maxIn]) i.classList.add('bad');
    setTimeout(() => { minIn.classList.remove('bad'); maxIn.classList.remove('bad'); }, 1500);
  };
  const setRange = () => {
    const a = parseFloat(minIn.value), b = parseFloat(maxIn.value);
    if (!Number.isFinite(a) || !Number.isFinite(b) || a >= b) {
      sync();  // keep the old values
      flashBad();
      return;
    }
    styleOf(v).vmin = a; styleOf(v).vmax = b;
    apply(false);
  };
  sel.addEventListener('change', () => { styleOf(v).cmap = sel.value; styleOf(v).reversed = false; apply(false); });
  rev.addEventListener('change', () => { styleOf(v).reversed = rev.checked; apply(false); });
  minIn.addEventListener('change', setRange);
  maxIn.addEventListener('change', setRange);
  autoBtn.addEventListener('click', () => {
    const r = autoRange(frameValues(v.name));
    if (!r) {  // nothing loaded for the current slice: keep the style
      autoBtn.title = AUTO_NONE;
      flashBad();
      return;
    }
    autoBtn.title = AUTO_TITLE;
    styleOf(v).vmin = r.vmin; styleOf(v).vmax = r.vmax;
    if (r.symmetric) {  // balanced signs: use a diverging colourmap unless the current one already is (D-49)
      const sym = symmetricCmap(styleOf(v).cmap, styleOf(v).reversed);
      styleOf(v).cmap = sym.cmap; styleOf(v).reversed = sym.reversed;
    }
    apply(false);
  });
  symBtn.addEventListener('click', () => {
    const s = styleOf(v);
    const m = Math.max(Math.abs(s.vmin), Math.abs(s.vmax));
    if (!(m > 0)) return;
    s.vmin = -m; s.vmax = m;
    apply(false);
  });
  sync();
  return sync;
}

function refreshCards() {
  const selBox = $('sel-cards'), otherBox = $('other-cards');
  const order = [...state.selected].reverse();
  const others = cfg.variables.map((v) => v.name).filter((n) => !state.selected.includes(n));
  selBox.append(...order.map((n) => cards.get(n).el));
  otherBox.append(...others.map((n) => cards.get(n).el));
  const n = cards.size;
  $('sec-selected').hidden = n === 0;
  $('sec-other').hidden = n === 0;  // keep an empty drop target when all are selected
  $('sel-head').textContent = `Selected (${order.length})`;
  $('other-label').textContent = `Other (${others.length})`;
  $('other-toggle').setAttribute('aria-expanded', String(!otherCollapsed));
  otherBox.hidden = otherCollapsed;
  for (const [name, c] of cards) {
    const active = state.selected.includes(name);
    const open = active && state.open.has(name);
    const visible = active && !state.hidden.has(name);
    c.el.classList.toggle('selected', active);
    c.el.classList.toggle('active', visible);
    c.visibility.innerHTML = state.hidden.has(name) ? ICON.eyeOff : ICON.eye;
    const action = `${visible ? 'Hide' : 'Show'} ${labelOf(varOf(name))}`;
    c.visibility.title = action;
    c.visibility.setAttribute('aria-label', action);
    c.visibility.setAttribute('aria-pressed', String(visible));
    c.el.classList.toggle('open', open);
    c.el.setAttribute('aria-pressed', String(active));
    c.gear.setAttribute('aria-expanded', String(open));
  }
}

$('other-toggle').addEventListener('click', () => {
  otherCollapsed = !otherCollapsed;
  store.set(OTHER_KEY, otherCollapsed ? '1' : '0');
  refreshCards();
});

function buildInfo() {

function initSidebar() {

// --------------------------------------------------------------------------- time scrubber

const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

function stepPositions(d) {
  const n = d.size;
  if (d.iso && d.iso.length === n && n > 1) {
    const t = d.iso.map((s) => Date.parse(s));
    if (t.every(Number.isFinite)) {
      const lo = Math.min(...t), hi = Math.max(...t);
      if (hi > lo) return {pos: t.map((x) => (x - lo) / (hi - lo)), timed: true, lo, hi};
    }
  }
  return {pos: Array.from({length: n}, (_, i) => (n > 1 ? i / (n - 1) : 0)), timed: false};
}

function dateTicks(lo, hi) {
  const out = [];
  const spanDays = (hi - lo) / 864e5;
  const first = new Date(lo);
  if (spanDays > 730) {
    const years = spanDays / 365.25;
    const step = [1, 2, 5, 10, 20, 50, 100].find((s) => years / s <= 10) || 100;
    let y = first.getUTCFullYear();
    if (Date.UTC(y, 0, 1) < lo) y += 1;
    y = Math.ceil(y / step) * step;
    for (; Date.UTC(y, 0, 1) <= hi; y += step) out.push({t: Date.UTC(y, 0, 1), text: String(y)});
  } else {
    const step = [1, 2, 3, 6].find((s) => spanDays / 30.4 / s <= 12) || 6;
    const y = first.getUTCFullYear();
    let m = first.getUTCMonth();
    if (Date.UTC(y, m, 1) < lo) m += 1;
    for (; Date.UTC(y, m, 1) <= hi; m += 1) {
      if ((y * 12 + m) % step) continue;
      const mm = m % 12;
      out.push({t: Date.UTC(y, m, 1), text: MONTHS[mm] + (mm === 0 || !out.length ? ` ${y + Math.floor(m / 12)}` : '')});
    }
  }
  return out;
}

function indexTicks(d, pos) {
  const n = d.size;
  const raw = Math.max(1, n / 8);
  const mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 5, 10].map((m) => m * mag).find((s) => s >= raw);
  const out = [];
  for (let i = 0; i < n; i += step) out.push({p: pos[i], text: dimLabel(d, i)});
  return out;
}

function stopPlay() {
  if (state.timer) clearInterval(state.timer);
  state.timer = null;
  if (state.scrub) { state.scrub.playBtn.innerHTML = ICON.play; state.scrub.playBtn.setAttribute('aria-label', 'Play'); }
}

function setDim(name, i) {
  state.dims[name] = i;
  syncUrl();
  for (const [vn, vl] of state.vlayers) {
    if (!varOf(vn).dims.includes(name)) continue;
    for (const src of vl.sources) src.updateDimensions({[name]: i});
  }
}

// Keep the role of every dim that has one; a new dim is horizontal only if no dim holds that role.
function syncRoles(dimNames) {
  let holder = dimNames.find((d) => state.roles[d] === 'h');
  for (const d of dimNames) {
    if (!state.roles[d]) state.roles[d] = holder === undefined ? 'h' : 'v';
    if (state.roles[d] === 'h') { if (holder === undefined) holder = d; else if (holder !== d) state.roles[d] = 'v'; }
  }
}

// Choosing Horizontal moves the previous holder to Vertical.
function setRole(name, role) {
  stopPlay();
  if (role === 'h') for (const d of unionDims()) if (d !== name && state.roles[d] === 'h') state.roles[d] = 'v';
  state.roles[name] = role;
  syncUrl();
  buildScrubber();
  const sel = $('dimrows').children[unionDims().indexOf(name)]?.children[1];
  if (sel && sel.focus) sel.focus();
}

function buildDimRoles(dimNames) {
  const rows = $('dimrows');
  rows.innerHTML = '';
  $('dimroles').hidden = dimNames.length === 0;
  for (const name of dimNames) {
    const sel = h('select');
    for (const [role, text] of ROLES) { const o = h('option', '', text); o.value = role; sel.append(o); }
    sel.value = state.roles[name];
    sel.addEventListener('change', () => setRole(name, sel.value));
    const row = h('label', 'dimrow');
    row.append(h('span', 'dimname', name), sel);
    rows.append(row);
  }
}

function buildScrubber() {
  stopPlay();
  state.scrub = null;
  state.vsteps = [];
  const dimNames = unionDims();
  state.scrubKey = dimNames.join('\u0000');
  syncRoles(dimNames);
  const bar = $('scrubber'), stack = $('dimstack');
  bar.innerHTML = ''; stack.innerHTML = '';
  const hDim = dimNames.find((d) => state.roles[d] === 'h');
  const vDims = dimNames.filter((d) => state.roles[d] === 'v');
  bar.hidden = !hDim;
  stack.hidden = !vDims.length;
  document.body.classList.toggle('has-scrub', !!hDim);
  buildDimRoles(dimNames);
  for (const name of dimNames) {
    const size = cfg.dims[name].size;
    state.dims[name] = clamp(state.dims[name] || 0, 0, size - 1);
  }
  if (hDim) buildTimeline(bar, hDim);
  for (const name of vDims) buildDimSlider(stack, name);
}

// Horizontal timeline for one dim: play/step buttons, rail with ticks, draggable handle.
function buildTimeline(bar, name) {
  const d = cfg.dims[name];
  const n = d.size;
  const {pos, timed, lo, hi} = stepPositions(d);
  const ctl = h('div', 'ctl');
  const mkBtn = (icon, label) => {
    const b = h('button'); b.type = 'button'; b.innerHTML = icon; b.setAttribute('aria-label', label); return b;
  };
  const playBtn = mkBtn(ICON.play, 'Play'), prevBtn = mkBtn(ICON.prev, 'Previous step'),
    nextBtn = mkBtn(ICON.next, 'Next step');
  ctl.append(prevBtn, playBtn, nextBtn);
  const track = h('div', 'track');
  track.append(h('div', 'rail'));
  const addMark = (p, cls) => { const m = h('div', `mark ${cls}`); m.style.left = `${100 * p}%`; track.append(m); };
  if (n <= 60) pos.forEach((p) => addMark(p, 'minor'));
  let major = [];
  if (timed) major = dateTicks(lo, hi).map((k) => ({p: (k.t - lo) / (hi - lo), text: k.text}));
  if (major.length < 2) major = indexTicks(d, pos);
  const labels = [];
  for (const k of major) {
    addMark(k.p, 'major');
    const lab = h('div', 'tlabel', String(k.text));
    lab.style.left = `${100 * k.p}%`;
    track.append(lab);
    labels.push(lab);
  }
  const handle = h('div', 'handle');
  handle.tabIndex = 0;
  handle.setAttribute('role', 'slider');
  handle.setAttribute('aria-label', name);
  handle.setAttribute('aria-valuemin', '0');
  handle.setAttribute('aria-valuemax', String(n - 1));
  const bubble = h('div', 'bubble');
  track.append(handle, bubble);
  bar.append(ctl, h('span', 'dname', name), track);

  const render = () => {
    const i = state.dims[name];
    handle.style.left = bubble.style.left = `${100 * pos[i]}%`;
    bubble.textContent = String(dimLabel(d, i));
    handle.setAttribute('aria-valuenow', String(i));
    handle.setAttribute('aria-valuetext', String(dimLabel(d, i)));
  };
  const setStep = (i) => {
    i = clamp(i, 0, n - 1);
    if (i !== state.dims[name]) setDim(name, i);
    render();
  };
  const step = (delta) => setStep(state.dims[name] + delta);
  const nearest = (clientX) => {
    const r = track.getBoundingClientRect();
    const x = r.width ? clamp((clientX - r.left) / r.width, 0, 1) : 0;
    let best = 0;
    for (let i = 1; i < n; i++) if (Math.abs(pos[i] - x) < Math.abs(pos[best] - x)) best = i;
    return best;
  };
  let dragging = false;
  track.addEventListener('pointerdown', (e) => {
    dragging = true;
    track.setPointerCapture(e.pointerId);
    handle.style.cursor = 'grabbing';
    stopPlay();
    setStep(nearest(e.clientX));
  });
  track.addEventListener('pointermove', (e) => { if (dragging) setStep(nearest(e.clientX)); });
  const end = () => { dragging = false; handle.style.cursor = ''; };
  track.addEventListener('pointerup', end);
  track.addEventListener('pointercancel', end);
  prevBtn.addEventListener('click', () => { stopPlay(); step(-1); });
  nextBtn.addEventListener('click', () => { stopPlay(); step(1); });
  playBtn.addEventListener('click', () => {
    if (state.timer) return stopPlay();
    playBtn.innerHTML = ICON.pause;
    playBtn.setAttribute('aria-label', 'Pause');
    state.timer = setInterval(() => setStep((state.dims[name] + 1) % n), 800);
  });

  // hide tick labels that would collide with the previous one
  const layoutLabels = () => {
    let right = -Infinity;
    for (const lab of labels) {
      lab.style.visibility = 'visible';
      const r = lab.getBoundingClientRect();
      if (r.left < right + 6) lab.style.visibility = 'hidden';
      else right = r.right;
    }
  };
  if (window.ResizeObserver) new ResizeObserver(layoutLabels).observe(track);
  else window.addEventListener('resize', layoutLabels);
  state.scrub = {name, step, playBtn};
  render();
  layoutLabels();
}

// Compact vertical slider for one dim (e.g. depth).
function buildDimSlider(stack, name) {
  const ed = cfg.dims[name];
  const item = h('div', 'dim');
  const val = h('span', 'val', String(dimLabel(ed, state.dims[name])));
  const inp = h('input');
  inp.type = 'range'; inp.min = 0; inp.max = ed.size - 1; inp.step = 1; inp.value = state.dims[name];
  inp.setAttribute('orient', 'vertical');
  inp.setAttribute('aria-label', name);
  const apply = () => { setDim(name, +inp.value); val.textContent = String(dimLabel(ed, +inp.value)); };
  inp.addEventListener('input', apply);
  // Keyboard stepping (D-50): the same path as a native input event, clamped at both ends.
  state.vsteps.push({name, step: (delta) => {
    const i = clamp(+inp.value + delta, 0, ed.size - 1);
    if (i === +inp.value) return;
    inp.value = i;
    apply();
  }});
  inp.addEventListener('keydown', (e) => dimKeyDown(e, name));
  item.append(h('span', 'lab', name), inp, val);
  stack.append(item);
}

// Arrow keys across the scrubbers (D-50). Left/Right step the horizontal dim, Up/Down the first vertical dim
// (Up = index - 1: the vertical slider has its minimum at the top). A key is only swallowed when it acts.
function scrubKeyDown(e) {
  if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
  if (e.target && e.target.closest && e.target.closest('input, select, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    if (!state.scrub) return;
    e.preventDefault();
    stopPlay();
    state.scrub.step(e.key === 'ArrowRight' ? 1 : -1);
  } else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    const v = state.vsteps[0];
    if (!v) return;
    e.preventDefault();
    v.step(e.key === 'ArrowDown' ? 1 : -1);
  }
}

// Focused vertical slider: Up/Down step that slider, Left/Right the horizontal scrubber. The native range
// stepping and the global handler are skipped when it acts; Home/End/PageUp/PageDown stay native.
function dimKeyDown(e, name) {
  if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
  let act;
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    const v = state.vsteps.find((x) => x.name === name);
    if (!v) return;
    act = () => v.step(e.key === 'ArrowDown' ? 1 : -1);
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    if (!state.scrub) return;
    act = () => { stopPlay(); state.scrub.step(e.key === 'ArrowRight' ? 1 : -1); };
  } else return;
  e.preventDefault();
  e.stopPropagation();
  act();
}

document.addEventListener('keydown', scrubKeyDown);

// --------------------------------------------------------------------------- map

// Global data (any centre longitude, 0 included): two extra copies of the data layer, shifted by
// ±360° (their tile grids are offset, so chunk indices are unchanged). Not wrapX (see D-24, D-26).
const LON_KEY = `gpm-preview:centerlon:${cfg.title}`;
const normLon = (x) => { const l = ((x + 180) % 360 + 360) % 360 - 180; return Number.isFinite(l) ? l : 0; };
const lonParam = new URLSearchParams(location.search).get('lon');
state.centerLon = cfg.global ? normLon(+(lonParam ?? store.get(LON_KEY) ?? 0)) : 0;

function shiftGrid(grid, dx) {
  const e = grid.getExtent();
  return new WMTSTileGrid({
    extent: [e[0] + dx, e[1], e[2] + dx, e[3]],
    origins: grid.getResolutions().map((_, z) => { const o = grid.getOrigin(z); return [o[0] + dx, o[1]]; }),
    resolutions: grid.getResolutions(),
    matrixIds: grid.getMatrixIds(),
    tileSizes: grid.getResolutions().map((_, z) => grid.getTileSize(z)),
  });
}

function makeLayers(v) {
  const offsets = cfg.global ? [0, -360, 360] : [0];
  const made = offsets.map((dx) => {
    const m = makeLayer(v);
    if (dx) {
      const shift = () => {
        if (m.source.getState() !== 'ready' || m.source.gpmShifted) return;
        m.source.tileGrid = shiftGrid(m.source.tileGrid, dx);
        m.source.gpmShifted = true;
      };
      m.source.on('change', shift);
      shift();
    }
    return m;
  });
  return {sources: made.map((m) => m.source), layers: made.map((m) => m.layer)};
}

function viewFor(opts) {
  const x = Number(params.get('x')), y = Number(params.get('y')), z = Number(params.get('z'));
  const pinned = params.has('z') && Number.isFinite(x) && Number.isFinite(y) && Number.isFinite(z);
  const lon = state.centerLon;
  const b = cfg.bbox;
  if (cfg.global) {
    opts = {...opts, center: [lon, (b[1] + b[3]) / 2], extent: [lon - 180, b[1], lon + 180, b[3]]};
  }
  return pinned ? {...opts, center: [x, y], zoom: z} : opts;
}

function makeLayer(v) {
  const dimensions = {};
  for (const n of v.dims) dimensions[n] = clamp(state.dims[n] || 0, 0, cfg.dims[n].size - 1);
  const opts = {url: storeUrl, bands: [v.name], transition: 0};
  if (cfg.crs.projection) opts.projection = cfg.crs.projection;
  if (v.dims.length) opts.dimensions = dimensions;
  const source = new GeoZarr(opts);
  source.addEventListener?.('error', showError);
  return {source, layer: new WebGLTileLayer({
    source, style: {color: colorExpr(v)}, opacity: opacityOf(v.name)})};
}

function updateSpine() {
  if (blank) {
    $('sbspine').firstElementChild.replaceChildren(h('i', null, 'no store loaded'));
    return;
  }
  const names = selVars().map((v) => labelOf(v)).join(', ');
  const span = $('sbspine').firstElementChild;
  span.replaceChildren(h('b', null, cfg.source || cfg.title), document.createTextNode(' \u00b7 '), h('i', null, names));
  $('sbspine').title = `${cfg.source || cfg.title} · ${names}`;
}

// Add or remove one variable's layer group; other variables' layers are left untouched.
function addVariable(name) {
  const vl = makeLayers(varOf(name));
  state.vlayers.set(name, vl);
  for (const l of vl.layers) state.map.getLayers().push(l);  // above the existing data layers
}

function removeVariable(name) {
  const vl = state.vlayers.get(name);
  if (!vl) return;
  for (const l of vl.layers) { state.map.getLayers().remove(l); l.dispose?.(); }
  state.vlayers.delete(name);
}

function toggleVar(name) {
  // Clicking an already-selected card never removes or reorders it.
  if (state.selected.includes(name)) return;
  moveVariable(name, true, state.selected.at(-1) || null);
}

function toggleVisibility(name) {
  if (!state.selected.includes(name)) return;
  const visible = state.hidden.has(name);
  if (visible) state.hidden.delete(name); else state.hidden.add(name);
  for (const layer of state.vlayers.get(name)?.layers || []) layer.setVisible(visible);
  refreshCards();
  syncUrl();
  $('readout').hidden = true;
}

function moveVariable(name, selected, before = null) {
  if (!cards.has(name)) return;
  const i = state.selected.indexOf(name);
  if (!selected && i < 0) return;
  if (selected && before === name) return;
  stopPlay();
  if (i >= 0) state.selected.splice(i, 1);
  if (selected) {
    // The sidebar is top-first; state.selected is bottom-first for the map.
    const order = [...state.selected].reverse();
    const index = before === null ? order.length : order.indexOf(before);
    order.splice(index < 0 ? order.length : index, 0, name);
    state.selected = order.reverse();
    if (i < 0) addVariable(name);
    // Reuse existing layers (and their sources/styles) in the new stacking order.
    const layers = state.map.getLayers();
    for (const n of state.selected) {
      for (const layer of state.vlayers.get(n).layers) layers.remove(layer);
    }
    for (const n of state.selected) {
      for (const layer of state.vlayers.get(n).layers) layers.push(layer);
    }
  } else {
    state.hidden.delete(name);
    state.open.delete(name);
    removeVariable(name);
  }
  syncUrl();
  updateSpine();
  refreshCards();
  if (state.scrubKey !== unionDims().join('\u0000')) buildScrubber();
  $('readout').hidden = true;
}

function initCenterLon() {
  if (!cfg.global) return;
  $('lonrow').hidden = false;
  const inp = $('centerlon');
  inp.value = state.centerLon;
  inp.addEventListener('change', () => {
    const lon = normLon(+inp.value);
    inp.value = lon;
    if (lon === state.centerLon) return;
    // Rebuilding the view in place is unreliable (a blank map), so reload with the new centre.
    store.set(LON_KEY, String(lon));
    const url = new URL(location.href);
    url.searchParams.set('lon', String(lon));
    for (const k of ['x', 'y', 'z']) url.searchParams.delete(k);
    location.replace(url.href);
  });
}

function initBasemap() {
  const sel = $('basemap');
  const layers = {};
  const options = cfg.basemap_default ? [['light', 'Light'], ['dark', 'Dark'], ['osm', 'OSM'], ['none', 'None']] : [['none', 'None']];
  for (const [k, label] of options) sel.add(new Option(label, k));
  if (cfg.basemap_default) {
    // One keyless source (OSM); Light/Dark are CSS filters on each layer's own canvas.
    const osm = (className) => new TileLayer({className, source: new OSM(), visible: false});
    layers.light = osm('bm-light');
    layers.dark = osm('bm-dark');
    layers.osm = osm('bm-osm');
  } else {
    sel.disabled = true;
  }
  const apply = () => { for (const [k, l] of Object.entries(layers)) l.setVisible(sel.value === k); };
  sel.value = cfg.basemap_default ? 'dark' : 'none';
  sel.addEventListener('change', apply);
  apply();
  return Object.values(layers);
}

// "Lat: 46.520°N  Lon: 6.630°E" for a view-projection coordinate, or null when it is outside the data
// extent (unless `force`) or the transform is not finite. Lon is normalised to [-180, 180).
function coordLine(map, coord, force) {
  let [x, y] = coord;
  const b = cfg.bbox;
  if (cfg.global) x = normLon(x);  // map shows +-360 copies of the world
  const over = b && x >= b[0] && x <= b[2] && y >= b[1] && y <= b[3];
  if (!over && !force) return null;
  const [lon0, lat] = toLonLat([x, y], map.getView().getProjection());
  if (!Number.isFinite(lon0) || !Number.isFinite(lat)) return null;
  const lon = normLon(lon0);
  const f = (v, p, n) => `${Math.abs(v).toFixed(3)}°${+v.toFixed(3) < 0 ? n : p}`;  // no "0.000°S"
  return `Lat: ${f(lat, 'N', 'S')}  Lon: ${f(lon, 'E', 'W')}`;
}

// Raw band-0 value under `coordinate`, read from the layer renderer's loaded-tile cache (null if none/NaN).
// WebGLTileLayer.getData is not usable: with the jsdelivr +esm bundles the GeoZarr source's DataTile
// is not the DataTile class WebGLTile checks with instanceof, and the source itself caches no tiles.
// Edge tiles are smaller than the grid tile size, so pixels are addressed by resolution, not extent.
// The renderer keeps tiles of earlier dimension slices (the source key changes with `dimensions`), so only
// tiles whose `key` is the source's current key are used; until those are loaded there is no value (D-41).
function sampleLayer(layer, source, coordinate) {
  const cache = layer.getRenderer?.()?.tileRepresentationCache;
  const grid = source.getTileGrid();
  if (!cache || !grid) return null;
  const [cx, cy] = coordinate;
  let best = null;
  cache.forEach((rep) => {
    const tile = rep && rep.loaded && rep.tile;
    if (!tile || tile.key !== source.getKey() || tile.getState() !== 2) return;  // 2 = TileState.LOADED
    const tc = tile.tileCoord;
    if (best && best.z >= tc[0]) return;
    const ext = grid.getTileCoordExtent(tc);
    const res = grid.getResolution(tc[0]);
    const col = Math.floor((cx - ext[0]) / res), row = Math.floor((ext[3] - cy) / res);
    const [w, h] = tile.getSize();
    if (col < 0 || row < 0 || col >= w || row >= h) return;
    best = {z: tc[0], tile, col, row, g: rep.gutter || 0, w, h};
  });
  if (!best) return null;
  const {tile, col, row, g, w, h} = best;
  const data = tile.getData();
  if (!data || !data.length) return null;
  const bands = Math.max(1, Math.round(data.length / ((w + 2 * g) * (h + 2 * g))));
  const px = ((row + g) * (w + 2 * g) + col + g) * bands;
  if (bands > 1 && !data[px + bands - 1]) return null;  // last band is alpha; 0 = nodata
  const val = data[px];
  return Number.isFinite(val) ? val : null;
}

function initReadout(map) {
  const ro = $('readout');
  const hide = () => { ro.hidden = true; };
  map.on('pointermove', (e) => {
    if (e.dragging || !state.vlayers.size) return hide();
    const lines = [];
    for (const name of [...state.selected].reverse()) {  // top-most first
      const vl = state.vlayers.get(name);
      if (!vl || state.hidden.has(name)) continue;
      let val = null;
      for (let i = 0; i < vl.layers.length; i++) {  // global mode: 3 world copies (0, -360, +360); first finite wins
        try { val = sampleLayer(vl.layers[i], vl.sources[i], e.coordinate); } catch (_) { val = null; }  // not rendered yet
        if (val !== null) break;
      }
      if (val === null) continue;
      const v = varOf(name);
      const u = unitsOf(v);
      lines.push(`${labelOf(v)}: ${v.categorical ? String(val) : +Number(val).toPrecision(4)}${!v.categorical && u ? ` ${u}` : ''}`);
    }
    const coord = coordLine(map, e.coordinate, lines.length > 0);
    if (!lines.length && !coord) return hide();
    ro.replaceChildren(...(coord ? [h('div', 'ro-coord', coord)] : []), ...lines.map((t) => h('div', 'ro-val', t)));
    ro.hidden = false;
    const o = e.originalEvent;
    const w = ro.offsetWidth, hgt = ro.offsetHeight;
    const x = o.clientX + 14 + w > innerWidth - 8 ? o.clientX - w - 14 : o.clientX + 14;
    const y = o.clientY + 14 + hgt > innerHeight - 8 ? o.clientY - hgt - 14 : o.clientY + 14;
    ro.style.transform = `translate(${x}px,${y}px)`;
  });
  map.getViewport().addEventListener('pointerleave', hide);
}

function init() {
  initStorePicker();
  initSidebar();
  initLabelMode();
  initGlobalCollapse();
  updateSpine();
  $('sbspine').addEventListener('click', () => $('sbtoggle').click());
  buildInfo();
  const basemaps = initBasemap();
  if (blank) {
    const b = cfg.bbox, lon = state.centerLon;
    const opts = viewFor({projection: cfg.crs.code, center: [lon, 0], zoom: 2, showFullExtent: true,
      extent: [lon - 180, b[1], lon + 180, b[3]]});
    // A Promise<ViewOptions>: a View built here fails Map's instanceof check (separate +esm bundles).
    state.map = new Map({target: 'map', layers: basemaps, view: Promise.resolve(opts)});
    state.map.on('moveend', syncUrl);
    syncUrl();
    initCenterLon();
    return;
  }
  buildCards();
  initCardDragging();
  refreshCards();
  buildScrubber();
  for (const name of state.selected) {
    const vl = makeLayers(varOf(name));
    for (const layer of vl.layers) layer.setVisible(!state.hidden.has(name));
    state.vlayers.set(name, vl);
  }
  const dataLayers = state.selected.flatMap((n) => state.vlayers.get(n).layers);
  // Pass a promise: Map's `view` option accepts Promise<ViewOptions> and resolves it. The resolved
  // options are adjusted for the centre longitude.
  const detachedInitial = !state.selected.length;
  const initial = state.vlayers.get(state.selected[0]) || makeLayers(cfg.variables[0]);
  const view = getView(initial.sources[0], withLowerResolutions(1), withHigherResolutions(2),
    withExtentCenter(), withZoom(2)).then(viewFor).finally(() => {
      if (detachedInitial) for (const layer of initial.layers) layer.dispose?.();
    });
  view.catch(showError);
  state.map = new Map({target: 'map', layers: [...basemaps, ...dataLayers], view});
  initReadout(state.map);
  state.map.on('moveend', syncUrl);
  syncUrl();
  initCenterLon();
}
try { init(); } catch (e) { showError(e); }
</script>
</body>
</html>
